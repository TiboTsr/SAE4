<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historque d'achat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/general.css">
    <link rel="stylesheet" href="../styles/panels.css">
    <link rel="stylesheet" href="../styles/historique.css?v=5">
</head>
<body>

     <!-- HEADER -->
     <header>
        <h1>Historque d'achat</h1>
    </header>

    <!-- MAIN -->
    <main>
        <section class="create-order" id="createOrderSection">
            <div class="create-order-header">
                <h2>Créer une commande</h2>
                <button type="button" id="toggleCreateOrder" aria-expanded="false" aria-controls="createOrderForm">
                    Dérouler
                </button>
            </div>
            <form id="createOrderForm" hidden>
                <div class="create-order-grid">
                    <label>
                        Article
                        <select id="orderArticle" required>
                            <option value="">Choisir un article</option>
                        </select>
                    </label>

                    <label>
                        Quantité
                        <input type="number" id="orderQuantity" min="1" value="1" required>
                    </label>

                    <label>
                        Paiement
                        <select id="orderPayment" required>
                            <option value="Especes">Especes</option>
                            <option value="TPE">TPE</option>
                            <option value="PayPal">PayPal</option>
                            <option value="Carte de credit">Carte de credit</option>
                        </select>
                    </label>

                    <label>
                        Utilisateur (optionnel)
                        <select id="orderUser">
                            <option value="">Client non inscrit</option>
                        </select>
                    </label>
                </div>

                <label class="checkbox-inline">
                    <input type="checkbox" id="orderRecovered">
                    Déjà récupérée
                </label>

                <div class="create-order-actions">
                    <button type="submit" id="createOrderButton">Créer la commande</button>
                    <p id="createOrderMessage" aria-live="polite"></p>
                </div>
            </form>
        </section>

        <!-- FILTERS -->
        <div class="filters">
            <div>
                <span>Boutique <div class="toggle toggle-active" id="toggle_boutique"></div></span>
                <span>Grades <div class="toggle toggle-active" id="toggle_grades"></div></span>
                <span>Evenements <div class="toggle toggle-active" id="toggle_events"></div></span>
            </div>
            <div>
                <input type="text" placeholder="Recherche un utilisateur" id="userSearch">
            </div>
        </div>

        <!-- TABLE -->
        <table id="table">
            <thead>
                <tr>
                    <th>Type</th>
                    <th>Element</th>
                    <th>Utilisateur</th>
                    <th>Date</th>
                    <th>Quantité</th>
                    <th>Prix payé</th>
                    <th>Paiement</th>
                    <th>Statut</th>
                </tr>
            </thead>
            <tbody id="tbody">
                <!-- AUTO GENERATED -->
            </tbody>
        </table>

    </main>
    
    <!-- SCRIPTS -->
    <script type="module" src="../scripts/toggle.js"></script>
    <script type="module" src="../scripts/historique.js?v=4"></script>

</body>
</html>
