<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../styles/general.css">
    <link rel="stylesheet" href="../styles/panels.css">
    <link rel="stylesheet" href="../styles/chat.css">

</head>
<body>

    <!-- HEADER -->
    <header>
        <h1>Messages</h1>
    </header>

    <!-- MAIN -->
    <main>

        <!-- MAIN PROPERTIES -->
        <div id="main_content" class="chat-layout">
            <div class="chat-toolbar">
                <p>Consulter le chat des administrateurs</p>
                <button id="chat_refresh" class="chat-refresh" type="button">Actualiser</button>
            </div>

            <section id="chat_messages" class="chat-messages" aria-live="polite"></section>

            <form id="chat_form" class="chat-form">
                <textarea id="chat_input" maxlength="1000" placeholder="Envoyer un message dans le chat des administrateurs" required></textarea>
                <button id="chat_send" type="submit">Envoyer</button>
            </form>

        </div>

    </main>

    <!-- SCRIPTS -->
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <script type="module" src="../scripts/chat.js"></script>
    
</body>
</html>
